name: Build
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - run: dotnet run --project Tests/UpdateTests.csproj -c Release
      - run: powershell.exe -NoProfile -ExecutionPolicy Bypass -File Tests/ProxyDiagnosticsTests.ps1
      - run: dotnet build -p Platform=x64 -c Release
